- name: PHP et Composer
  ansible.builtin.apt:
    name:
      - "php{{ php_version }}-cli"
      - "php{{ php_version }}-mbstring"
      - "php{{ php_version }}-xml"
      - "php{{ php_version }}-curl"
      - "php{{ php_version }}-zip"
      - "php{{ php_version }}-sqlite3"
      - "php{{ php_version }}-intl"
      - "php{{ php_version }}-bcmath"
      - composer
    state: present
